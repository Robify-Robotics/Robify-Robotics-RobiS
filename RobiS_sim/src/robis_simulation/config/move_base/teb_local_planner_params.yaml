TebLocalPlannerROS:
  odom_topic: /odom
  map_frame: map
  transform_tolerance: 1.0

  teb_autosize: true
  dt_ref: 0.30
  dt_hysteresis: 0.03
  max_samples: 120
  global_plan_overwrite_orientation: true
  allow_init_with_backwards_motion: false
  max_global_plan_lookahead_dist: 1.5
  global_plan_viapoint_sep: 0.4
  global_plan_prune_distance: 1.0

  max_vel_x: 0.25
  max_vel_x_backwards: 0.03
  max_vel_theta: 0.60
  acc_lim_x: 0.35
  acc_lim_theta: 0.80
  min_turning_radius: 0.0
  wheelbase: 0.304
  cmd_angle_instead_rotvel: false

  footprint_model:
    type: "polygon"
    vertices: [[0.235, 0.180], [0.235, -0.180], [-0.235, -0.180], [-0.235, 0.180]]

  xy_goal_tolerance: 0.20
  yaw_goal_tolerance: 0.30
  free_goal_vel: false

  min_obstacle_dist: 0.24
  inflation_dist: 0.42
  include_costmap_obstacles: true
  costmap_obstacles_behind_robot_dist: 1.0
  obstacle_poses_affected: 15
  costmap_converter_plugin: ""
  costmap_converter_spin_thread: true
  costmap_converter_rate: 5

  no_inner_iterations: 5
  no_outer_iterations: 4
  optimization_activate: true
  optimization_verbose: false
  penalty_epsilon: 0.01
  weight_max_vel_x: 2
  weight_max_vel_theta: 1
  weight_acc_lim_x: 5
  weight_acc_lim_theta: 2
  weight_kinematics_nh: 1000
  weight_kinematics_forward_drive: 90
  weight_kinematics_turning_radius: 1
  weight_optimaltime: 3
  weight_obstacle: 60
  weight_inflation: 1.0

  enable_homotopy_class_planning: false
  enable_multithreading: false
  max_number_classes: 2
  selection_cost_hysteresis: 1.0
  selection_prefer_initial_plan: 0.9
  selection_obst_cost_scale: 20.0
  selection_alternative_time_cost: false

  exact_arc_length: false
  feasibility_check_no_poses: 30
  complete_global_plan: true
  weight_viapoint: 10
  delete_detours_backwards: true
  oscillation_recovery: true
  oscillation_v_eps: 0.05
  oscillation_omega_eps: 0.05
  oscillation_recovery_min_duration: 3
  oscillation_filter_duration: 5
  publish_feedback: false
